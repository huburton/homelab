# ESPHome dashboard for the ESP32 sensors. Host network: mDNS discovery (and Home Assistant finds the devices).
services:
  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    privileged: true     # flashing over USB
    environment:
      - ESPHOME_DASHBOARD_USE_PING=true
    volumes:
      - esphome_config:/config
      - /etc/localtime:/etc/localtime:ro

volumes:
  esphome_config:
