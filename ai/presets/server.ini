version = 1
; llama.cpp router on the server (RTX 2060 6 GB, 31 GB RAM): systemd/llama-router-server.service, port 8095.
; Both models stay loaded 24/7 (background jobs: job-offer scoring, summaries, semantic search).
; Model name to use in requests = section name.

[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
parallel = 1
load-on-startup = true
; Prompt cache in RAM: the 8 GB default was most of the router's memory; RAM is shared with other services.
cache-ram = 1024

; General model, 24/7: Qwen3.6-35B-A3B MoE (unsloth UD-IQ3_XXS, with MTP head). The MoE experts stay in RAM
; (n-cpu-moe), attention and KV cache go to the RTX 2060 (~2.9 GB VRAM). Measured with ai/bench.py:
; 21 tok/s (33 with reasoning), prompt ~125 tok/s, tool calls 3/3, JSON schema OK.
; It replaced a dense 4B model that fit in VRAM but answered worse (and in English).
[qwen3.6-35b-a3b]
model = /srv/ai/models/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf
chat-template-file = /srv/ai/templates/qwen-lenient.jinja
n-gpu-layers = 99
n-cpu-moe = 99
threads = 6
c = 32768
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0

; Multilingual embeddings (notes, job offers) -> POST /v1/embeddings, 1024 dimensions
[qwen3-embedding-0.6b]
model = /srv/ai/models/Qwen3-Embedding-0.6B-Q8_0.gguf
embeddings = true
c = 8192
; On CPU: the GPU is left to the main model, and a 0.6B model is fast enough on the i5
n-gpu-layers = 0
