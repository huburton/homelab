version = 1
; llama.cpp router on the desktop (RTX 5080 16 GB): systemd/llama-router-desktop.service, port 8080.
; One model loaded at a time (--models-max 1), unloaded after 10 min without requests.
; Model name to use in requests = section name.

[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
parallel = 1
sleep-idle-seconds = 600
; --fit (default): if VRAM is short (wallpaper, game...), offload layers to the CPU instead of failing

; Coding agent / complex tasks (claude-local, job-offer judge when the desktop is free).
; Only fits fully in VRAM in AI mode (animated wallpaper paused, see ai-mode).
; Qwen3.8-27B IQ3_XXS (12.6 GB file). Measured with ai/bench.py: ~85 tok/s without reasoning, ~104 with,
; tool calls 3/3, JSON OK, French answers stay in French.
[qwen3.8-27b]
model = /opt/llm/models/Qwen3.8-27B-IQ3_XXS.gguf
; All in VRAM or nothing: without room (wallpaper running) the load fails cleanly and clients fall back to the
; server, instead of running half on the CPU and freezing the desktop.
fit = off
n-gpu-layers = 999
chat-template-file = /opt/llm/templates/qwen-lenient.jinja
; 24K + built-in MTP head depth 3: 15.7 GB. 32K + MTP does not fit.
c = 24576
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0

; Same model, long window for claude-local (Claude Code uses ~20K tokens of context by itself):
; 64K with a q4_0 KV cache (15.3 GB, ~55 tok/s). With q8_0 it has to drop to 48K; no room for MTP here.
[qwen3.8-27b-long]
model = /opt/llm/models/Qwen3.8-27B-IQ3_XXS.gguf
fit = off
n-gpu-layers = 999
chat-template-file = /opt/llm/templates/qwen-lenient.jinja
c = 65536
cache-type-k = q4_0
cache-type-v = q4_0
parallel = 1
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0

; Fast assistant (voice assistant, summaries, short questions): fits next to the animated wallpaper.
[qwen3.5-9b]
model = /opt/llm/models/Qwen3.5-9B-UD-Q4_K_XL.gguf
chat-template-file = /opt/llm/templates/qwen-lenient.jinja
c = 32768
reasoning = off
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
