name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest==8.3.3

      - name: Compose files
        run: ./scripts/check-compose.sh

      - name: Shellcheck
        run: make shellcheck

      - name: Python
        run: make python
